modules:
  jira:issueContext:
    - key: jiragotchi-pet
      resource: main
      resolver:
        function: resolver
      title: Jiragotchi
      label: 🪨 Jiragotchi
  jira:globalPage:
    - key: jiragotchi-clubhouse
      resource: main
      resolver:
        function: resolver
      title: Jiragotchi Clubhouse
      icon: https://developer.atlassian.com/platform/forge/images/icons/jira-icon.svg
  function:
    - key: resolver
      handler: index.handler
    - key: resolver-webtrigger
      handler: index.webtriggerHandler
  webtrigger:
    # One trigger, three actions selected via the URL path:
    #   .../<base>/leaderboard | /sql | /clear
    - key: demo-data
      function: resolver-webtrigger
      urlFormat: v2

resources:
  - key: main
    path: static/custom-ui/build

permissions:
  scopes:
    - read:jira-work
    - storage:app

app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/fc400b8e-f0c4-4085-8144-384d098adcee
  storage:
    entities:
      - name: pet
        attributes:
          projectId:
            type: string
          happiness:
            type: integer
          lastFedAt:
            type: string
        indexes:
          - name: leaderboard
            range:
              - happiness
